name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Construir la web (un solo index.html)
        run: python3 build.py www/index.html

      - name: Instalar Capacitor
        run: npm install

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Número de versión
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar con la clave fija (para poder actualizar sin perder datos)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > voltio.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
          "$BT/apksigner" sign --ks voltio.keystore --ks-key-alias voltio \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out voltio.apk alineado.apk
          "$BT/apksigner" verify voltio.apk
          rm voltio.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: voltio-apk
          path: voltio.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Voltio 1.0.${{ github.run_number }}
          body: Compilación automática de ${{ github.sha }}
          files: voltio.apk
          make_latest: true
