<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Ledly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Righteous&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" role="img" aria-label="Ledly">Le<svg class="logo-d" viewBox="0 0 62 100" aria-hidden="true"><defs><radialGradient id="lgb" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#FFE9A8"/><stop offset=".5" stop-color="#FFC233"/><stop offset="1" stop-color="#FF9F00"/></radialGradient></defs><path d="M43 46h3q6 0 6 -6V5" class="lgleg"/><path d="M43 65h9q7 0 7 -7V15" class="lgleg"/><path d="M36 31H27a24.5 24.5 0 0 0 0 49h9z" fill="url(#lgb)"/><rect x="34.5" y="27" width="9.5" height="57" rx="3" fill="#E08A00"/><path d="M11 49a15 15 0 0 1 11 -11" stroke="#fff" stroke-opacity=".75" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>ly</span></div>
    <button class="stat goalstat" data-go="profile" id="tGoal" aria-label="Objetivo diario"></button>
    <button class="stat" data-go="streak" aria-label="Racha"><span class="mini-led" id="tLed"></span><span id="tStreak">0</span></button>
    <button class="stat" data-go="streak" data-anchor="shop" aria-label="Protectores"><span class="ice"></span><span id="tFreeze">0</span></button>
    <button class="stat" data-go="streak" data-anchor="shop" aria-label="Gemas"><span class="gem"></span><span id="tGems">0</span></button>
  </header>
  <main id="main"></main>
</div>
<nav class="nav"><div class="nav-in">
  <button data-go="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Aprender</button>
  <button data-go="review"><span class="nbw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg><span class="nbadge" id="revBadge" hidden>0</span></span>Repasar</button>
  <button data-go="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h1M11 9h1M15 9h1M7 15h1M11 15h1M15 15h1"/></svg>Lab</button>
  <button data-go="streak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>Racha</button>
  <button data-go="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
</div></nav>
<script>/*JS*/</script>
</body>
</html>
