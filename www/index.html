<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Voltio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}
:root{
  --bg:#EEF2F5;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6782;--line:#D5DCE6;
  --led:#FFB000;--led-glow:rgba(255,176,0,.55);--ok:#1F9D55;--ok-soft:#DDF3E6;--err:#D64545;--err-soft:#FBE3E3;
  --ice:#3E8FCB;--ice-soft:#DCEBF7;--gem:#7A4FD6;--trace:#B9C4D3;--board:#14213D;
  --bb:#F3F1EC;--bbhole:#3A3A3A;--code:#0F1A2E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--surface:#17223A;--ink:#E8EDF5;--muted:#9AA7BF;--line:#2A3755;--ok-soft:#173A2A;--err-soft:#3D1D22;--ice-soft:#16304A;--trace:#33425F;--board:#0A1120;--bb:#DDD9D0;--code:#0A1120}}
:root[data-theme="dark"]{--bg:#0E1626;--surface:#17223A;--ink:#E8EDF5;--muted:#9AA7BF;--line:#2A3755;--ok-soft:#173A2A;--err-soft:#3D1D22;--ice-soft:#16304A;--trace:#33425F;--board:#0A1120;--bb:#DDD9D0;--code:#0A1120}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--led);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.app{max-width:620px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{font-family:var(--display);font-weight:800;font-size:22px;margin-right:auto;letter-spacing:-.02em}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;background:none;border:0;padding:4px}
.mini-led{width:14px;height:14px;border-radius:50%;background:var(--trace)}
.mini-led.on{background:var(--led);box-shadow:0 0 10px var(--led-glow)}
.gem{width:13px;height:13px;background:var(--gem);transform:rotate(45deg);border-radius:2px}
.ice{width:14px;height:14px;border-radius:4px;background:var(--ice);display:inline-block}
main{flex:1;overflow-y:auto;padding:4px 18px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav svg{width:24px;height:24px}
.ptitle{font-size:26px;margin:14px 0 4px}
.small{font-size:14px;color:var(--muted)}
.center-t{text-align:center}

/* ruta */
.unit{margin:18px 0 6px;padding:16px 18px;border-radius:14px;background:var(--board);color:#E8EDF5}
.unit h2{font-size:20px}.unit p{margin:4px 0 10px;color:#AEB9CF;font-size:15px}
.uprog{height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;flex:1}
.uprog i{display:block;height:100%;background:var(--led)}
.card .uprog{background:var(--line)}
.path{position:relative;padding:22px 0 8px}
.node-row{display:flex;justify-content:center;position:relative;height:152px;padding-top:20px}
.node{position:relative;width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 0 0 4px var(--trace) inset,0 5px 0 var(--line);display:grid;place-items:center;z-index:2}
.node:active{transform:translateY(3px)}
.node.k-sim{border-radius:20px}.node.k-project{border-radius:20px;transform:rotate(45deg)}.node.k-project>svg{transform:rotate(-45deg)}.node.k-project .node-label{transform:translateX(-50%) rotate(-45deg);top:90px;left:20%}
.node.k-route{border-radius:12px}
.node.done{box-shadow:0 0 0 4px var(--led) inset,0 5px 0 #C78900}
.node.current{box-shadow:0 0 0 4px var(--ink) inset,0 5px 0 var(--muted)}
.node.locked{opacity:.5}
.node svg{width:34px;height:34px}
.node-label{position:absolute;top:84px;width:170px;left:50%;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:700;line-height:1.25}
.k-project .start-tag{transform:translateX(-50%) rotate(-45deg)}
.start-tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap}

/* tarjetas y botones */
.card{background:var(--surface);border-radius:14px;padding:18px;margin:14px 0;border:1px solid var(--line)}
.card h3{font-size:18px;margin-bottom:6px}.card p{margin:0 0 10px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg);box-shadow:0 4px 0 var(--muted)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.amber{background:var(--led);color:#1B1300;box-shadow:0 4px 0 #B87D00}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn+.btn{margin-top:10px}
.btn.okb{background:var(--ok);color:#fff;box-shadow:0 4px 0 #157340}.btn.badb{background:var(--err);color:#fff;box-shadow:0 4px 0 #A33030}
.sbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
.sbtn.danger{color:var(--err)}
.row{display:flex;align-items:center;gap:14px}.row .grow{flex:1}
.shop-icon{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kv b{display:block;font-family:var(--display);font-size:24px}.kv span{font-size:13px;color:var(--muted)}
.mprog{display:grid;grid-template-columns:1fr 90px 36px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.mprog small{color:var(--muted);text-align:right}
.switch{display:flex;gap:10px;align-items:center;font-weight:700}.switch input{width:22px;height:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* racha */
.hero{text-align:center;padding:26px 0 8px}
.big-led{width:150px;height:150px;margin:0 auto;position:relative}
.big-led .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:54px;color:#1B1300;padding-top:14px}
.big-led.off .num{color:var(--muted)}
.hero h1{font-size:28px;margin-top:10px}.hero p{color:var(--muted);margin:4px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:28px;height:28px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.dot.done{background:var(--led);border-color:var(--led);box-shadow:0 0 10px var(--led-glow)}
.dot.frozen{background:var(--ice);border-color:var(--ice)}.dot.repaired{background:var(--led);border-color:var(--led);opacity:.5}
.dot.today{border-color:var(--ink);border-width:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px}
.cal .h{color:var(--muted);font-size:12px;font-weight:700}.cal .c{aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.cal .c.done{background:var(--led);color:#1B1300;font-weight:700}.cal .c.frozen{background:var(--ice);color:#fff;font-weight:700}
.cal .c.repaired{background:repeating-linear-gradient(45deg,var(--led),var(--led) 4px,transparent 4px,transparent 7px);font-weight:700}
.cal .c.today{outline:2px solid var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.repair{border:2px solid var(--led)}
.miles{display:flex;flex-direction:column}.mile{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.mile:last-child{border:0}
.mile b{font-family:var(--display)}.mile .r{color:var(--muted)}.mile.got .r{color:var(--ok);font-weight:700}

/* lección */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lesson-in{max-width:620px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:12px 18px 0;min-height:0}
.lbar{display:flex;align-items:center;gap:12px}
.stitle{font-size:19px}
.close{background:none;border:0;padding:6px;font-size:28px;line-height:1;color:var(--muted)}
.prog{flex:1;height:14px;background:var(--line);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--led);border-radius:8px;transition:width .35s}
.q{flex:1;overflow-y:auto;padding:18px 0 12px}
.q h2{font-size:22px;margin-bottom:16px}
.q .kind{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.foot{padding:12px 0 16px}
.sheet{margin:0 -18px;padding:16px 18px 18px;border-radius:16px 16px 0 0}
.sheet.ok{background:var(--ok-soft)}.sheet.bad{background:var(--err-soft)}
.sheet h3{font-size:19px;margin-bottom:4px}.sheet.ok h3{color:var(--ok)}.sheet.bad h3{color:var(--err)}
.sheet p{margin:0 0 12px;font-size:16px}
.hintbar{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--err-soft);font-size:15px;border-left:4px solid var(--err)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 3px 0 var(--line);font-size:17px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.schopt{padding:8px;display:grid;place-items:center}
.numin{display:flex;align-items:center;gap:10px;margin-top:6px}
.numin input{flex:1;min-width:0;font:inherit;font-size:24px;font-weight:700;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.numin span{font-family:var(--display);font-weight:700;font-size:22px}
.code{background:var(--code);color:#D7E3F4;padding:14px;border-radius:12px;font-size:14px;line-height:1.5;overflow-x:auto;margin:0 0 14px;white-space:pre}
.schbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px;display:grid;place-items:center;overflow-x:auto}
.resistor{display:block;margin:0 auto 10px;max-width:100%}
.info p{margin:0 0 12px;font-size:17px}
.info .tune{margin-bottom:14px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.center h1{font-size:30px}.center p{color:var(--muted);margin:0;max-width:36ch}
.chips{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;justify-content:center}.chip{border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:88px}
.chip b{display:block;font-family:var(--display);font-size:24px}.chip span{font-size:13px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,17,32,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.modal h2{font-size:24px;margin:10px 0 6px}.modal p{color:var(--muted);margin:0 0 16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:40;font-size:15px;max-width:90%;text-align:center}
.glow{animation:glow 1.2s ease-out}@keyframes glow{0%{filter:brightness(.4)}40%{filter:brightness(1.6)}100%{filter:brightness(1)}}

/* widgets: circuitos con deslizadores */
.viz{width:100%;height:auto;display:block;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.vizlab{font-size:12.5px;fill:currentColor;font-family:var(--body);font-weight:700}
.vizsm{font-size:11px;fill:var(--muted);font-family:var(--body)}
.vizbig{font-size:13px;fill:currentColor;font-family:var(--display);font-weight:700}
.meterc{fill:var(--bg);stroke:currentColor;stroke-width:2}
.flow{fill:none;stroke:var(--led);stroke-width:4;stroke-dasharray:2 14;stroke-linecap:round;animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.tctl{display:flex;flex-direction:column;gap:2px;margin:12px 0 0;font-size:15px}
.tctl span{display:flex;justify-content:space-between}
.tctl input{width:100%;accent-color:var(--led);height:28px}
.goal{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface);border:2px dashed var(--line);font-weight:700;font-size:15px}
.goal.met{border:2px solid var(--ok);color:var(--ok);background:var(--ok-soft)}

/* multímetro */
.mtr{display:flex;flex-direction:column;gap:10px}
.mpt{cursor:pointer}.mhit{fill:transparent}.mdot{fill:var(--surface);stroke:var(--led);stroke-width:3}
.mprobe{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mprobe button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:700;font-size:14px}
.mprobe .pr[aria-pressed="true"]{border-color:#E5484D;background:#E5484D;color:#fff}
.mprobe .pb[aria-pressed="true"]{border-color:#222;background:#222;color:#fff}
.mbody{display:grid;place-items:center}
.msvg{width:100%;max-width:330px}
.mcase{fill:#F2A900;stroke:#B87D00;stroke-width:3}
.mlcd{fill:#B9C7A6;stroke:#3B4436;stroke-width:3}
.mdig{font-family:"Courier New",monospace;font-size:44px;font-weight:700;fill:#1E2419;letter-spacing:2px}
.munit{font-size:13px;font-weight:700;fill:#1E2419;font-family:var(--body)}
.mfuse{font-size:13px;font-weight:700;fill:#A33030}
.mdialbg{fill:#2A2A2A}.mknob{fill:#3A3A3A;stroke:#555;stroke-width:3}
.mptr{stroke:#F2A900;stroke-width:7;stroke-linecap:round}
.mdpos{cursor:pointer}.mdhit{fill:transparent}
.mdl{font-size:9.5px;fill:#CFCFCF;font-family:var(--body);font-weight:700}
.mdpos.on .mdl{fill:#FFB000;font-size:12px}
.mgrp{font-size:12px;fill:#1B1300;font-weight:800;font-family:var(--body)}
.mjack{cursor:pointer}.mjo{fill:#1c1c1c}.mji{fill:#555}.mjl{font-size:12px;font-weight:800;fill:#1B1300;font-family:var(--body)}
.mjack.red .mjo{stroke:#E5484D;stroke-width:3}
.mrot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mrot button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:700}
.mpos{font-weight:700;font-size:15px;text-align:center}

/* otros widgets */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcol button{min-height:64px;background:var(--surface);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);padding:6px;font-weight:700;font-size:15px;display:grid;place-items:center}
.mcol button[aria-pressed="true"]{border-color:var(--ink)}
.mcol button.ok{opacity:.35;border-color:var(--ok)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.oans{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:6px;min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:8px;counter-reset:o}
.oans li{counter-increment:o;display:flex;gap:8px;align-items:center}.oans li::before{content:counter(o);font-weight:800;width:22px;text-align:center;color:var(--muted)}
.oans li.ph::before{content:''}.oans li.ph{color:var(--muted);font-size:15px;padding:8px}
.oans button,.opool button{text-align:left;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.opool{display:flex;flex-direction:column;gap:6px}
.tt{width:100%;border-collapse:collapse;margin-top:12px;text-align:center;font-size:18px;font-weight:700}
.tt th,.tt td{padding:8px;border-bottom:1px solid var(--line)}
.tt button{width:56px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px}
.tt button.one{background:var(--led);border-color:var(--led);color:#1B1300}.tt button.zero{background:var(--bg)}
.live{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px}
.live button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;font-size:17px}
.live button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.bits button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bits button[aria-pressed="true"]{border-color:var(--led)}
.bits b{font-size:18px}.bits small{font-size:11px;color:var(--muted)}
.bbm{fill:var(--bb)}.bbgap{fill:#CFCAC0}
.hole{fill:var(--bbhole)}.hstart{fill:var(--led);stroke:#B87D00;stroke-width:1.5}.hsel{fill:var(--ice);stroke:#1d5d8f;stroke-width:1.5}
.lbl{font-size:10px;fill:#6B6B6B;font-family:var(--body);font-weight:700}
.bbsvg{background:transparent;border:0}
.unohdr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#0E7C86;padding:10px;border-radius:12px}
.unohdr button{background:#1c1c1c;color:#fff;border:2px solid #1c1c1c;border-radius:8px;padding:8px 0;font-weight:700;font-size:14px;position:relative}
.unohdr button i{color:var(--led);font-style:normal;margin-left:1px}
.unohdr button[aria-pressed="true"]{border-color:var(--led);background:#3A2A00}
.tapimg [data-z]{cursor:pointer}.tapimg .zsel{filter:drop-shadow(0 0 6px var(--led))}.tapimg .zsel path,.tapimg .zsel rect{stroke:var(--led)}
.rbox{margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.slots button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:700;font-size:14px}
.slots button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pal button{display:flex;gap:8px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;font-size:14px;line-height:1.2}
.pal i{width:22px;height:30px;border-radius:4px;border:1px solid #9998;flex:none}.pal small{color:var(--muted)}

/* simulador */
.simscreen .q{padding-top:8px}
.brief{font-weight:700;margin:6px 0 10px}
.det{margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.det summary{font-weight:700;cursor:pointer}.det .schbox,.det .code{margin:10px 0 0}
.sim{display:flex;flex-direction:column;gap:8px;position:relative}
.simbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.simbar button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;font-weight:700;font-size:13.5px}
.simbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.simbar .addp{background:var(--led);border-color:var(--led);color:#1B1300}
.simbar .sp{flex:1}
.simwrap{overflow:auto;max-height:58vh;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative;touch-action:pan-x pan-y}
.board{display:block}
.bb{fill:var(--bb);stroke:#CFCAC0;stroke-width:2}
.rail-r{stroke:#E5484D;stroke-width:2}.rail-b{stroke:#3E8FCB;stroke-width:2}.rplus{fill:#E5484D}
.lead{stroke:#9AA3B2;stroke-width:2.5}.leg{fill:#9AA3B2}
.resb{fill:#E7D3A8;stroke:#C9B183}.resb.burnt,.ledb.burnt{fill:#3a2a1a}
.ledk{font-size:9px;fill:#fff;font-weight:700;font-family:var(--body)}.flat{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:1.5}
.pushb{fill:#2b2b2b}.pushk{fill:#666;stroke:#111;stroke-width:2}.pushk.down{fill:#999}
.swk{fill:#111}.capb{fill:#1F4E9C}.capst{fill:#D7DEE8}.tinylab{font-size:9px;fill:#555;font-weight:700;font-family:var(--body)}
.db{fill:#E88A5A}.zb{fill:#C24A2A}.dband{fill:#111}
.potb{fill:#1E5FB4}.potk{fill:#EEE;stroke:#888}.potl{stroke:#333;stroke-width:2.5;stroke-linecap:round}
.ldrb{fill:#D8A94A;stroke:#9a7428}.ldrs{fill:none;stroke:#7a3a1a;stroke-width:1.5}
.npnb{fill:#1c1c1c}.npnl{font-size:9px;fill:#ddd;font-weight:700;font-family:var(--body)}.icb{fill:#1c1c1c}
.motb{fill:#B0B6BE;stroke:#7a8088;stroke-width:2}.motl{stroke:#333;stroke-width:3;stroke-linecap:round}
.wire{fill:none;stroke-width:4;stroke-linecap:round}.wsel{stroke-width:7}.wirehit{fill:none;stroke:transparent;stroke-width:16}
.comp{cursor:pointer}.selbox{fill:none;stroke:var(--led);stroke-width:2.5;stroke-dasharray:5 4}
.pick{fill:none;stroke:var(--led);stroke-width:3}.probe{fill:none;stroke:#E5484D;stroke-width:3}
.term{fill:#C9CED6;stroke:#555;stroke-width:2}.term.tp{fill:#E5484D}.term.tn{fill:#2b2b2b}
.bat{fill:#1d1f24}.batcap{fill:#F2A900}.batlab{font-size:20px;font-weight:800;fill:#F2A900;font-family:var(--display)}
.unob{fill:#0E7C86}.unousb{fill:#BFC4C9}.unojack{fill:#111}.unochip{fill:#1c1c1c}.unochiplab{font-size:11px;fill:#ccc;font-family:var(--body)}
.unolab{font-size:22px;font-weight:800;fill:#fff;font-family:var(--display)}.unosm{font-size:10px;fill:#fff;font-family:var(--body)}
.hdr{fill:#111}.pinlab{font-size:9px;fill:#fff;font-weight:700;font-family:var(--body)}
.l13{fill:#5a4a20}.l13.on{fill:#FFB000;filter:drop-shadow(0 0 4px #FFB000)}
.smoke{font-size:16px}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.insp p{margin:0 0 6px}
.mread{font-family:var(--display);font-weight:700;color:var(--ink);background:#B9C7A6;color:#1E2419;border-radius:8px;padding:6px 10px;display:inline-block}
.mread:empty{display:none}
.ictl{display:flex;flex-direction:column;gap:4px;font-weight:700;margin:6px 0}
.ictl select,.ictl input{font:inherit;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);accent-color:var(--led)}
.ibtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tray{position:absolute;inset:0;background:rgba(10,17,32,.4);z-index:5;display:flex;align-items:flex-start;justify-content:center;border-radius:12px}
.trayin{background:var(--surface);border-radius:14px;padding:14px;margin-top:6px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--line)}
.trayin p{margin:0 0 8px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgrid button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-weight:700;font-size:14px;text-align:left}
.tgrid button[aria-pressed="true"]{border-color:var(--led)}
.shortw{position:sticky;left:0;bottom:0;background:var(--err);color:#fff;font-weight:700;padding:8px 12px;font-size:14px}
.three{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.three canvas{display:block;width:100%}
.three-hint{position:absolute;left:12px;top:8px;margin:0}
.checks .clist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.clist li{padding:10px 12px;border-radius:10px;font-weight:700;font-size:15px}
.clist li.ok{background:var(--ok-soft);color:var(--ok)}.clist li.no{background:var(--err-soft);color:var(--err)}

/* proyecto y rutado */
.proj h3{font-size:18px;margin:16px 0 6px}
.bom,.steps{margin:0;padding-left:22px}.bom li,.steps li{margin:4px 0}
.pchk{display:flex;flex-direction:column;gap:8px}
.pchk label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pchk input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.route{display:flex;flex-direction:column;gap:10px}
.pcb{width:100%;max-width:420px;margin:0 auto;display:block}
.pcbb{fill:#1F5E3B}.pcbg{fill:#2F7A50}.drill{fill:#1a1a1a}
.padc{stroke:#C9A227;stroke-width:3}.padl{font-size:11px;font-weight:800;fill:#EDE6C8;font-family:var(--body)}
.trk{fill:none;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:.9}.trk.ok{opacity:1}
.rstat{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.goal:empty{display:none}
.unohdr button{font-size:13px}

/* ======== Identidad v3 ======== */
:root{--copper:#C8803A}
body{background-color:var(--bg);background-image:radial-gradient(circle,var(--perf,rgba(20,33,61,.07)) 1.3px,transparent 1.6px);background-size:18px 18px;background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--perf:rgba(232,237,245,.05)}}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:6px}
.nav-in{grid-template-columns:repeat(5,1fr)}
.nbw{position:relative;display:inline-block}
.nbadge{position:absolute;top:-6px;right:-12px;background:var(--err);color:#fff;font-size:11px;font-weight:800;border-radius:9px;padding:1px 6px;line-height:1.4}
/* cabecera de módulo: placa con resistencia que codifica el número */
.unit{position:relative;overflow:hidden;border-left:8px solid var(--uc);padding-left:16px;background:linear-gradient(135deg,var(--board) 70%,color-mix(in srgb,var(--uc) 35%,var(--board)))}
.unit::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.08)}
.uhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.unum{font-family:var(--display);font-weight:700;font-size:14px;color:#C9D3E6}
.unit h2{font-size:22px;letter-spacing:-.01em}
.unit .uprog i{background:var(--uc)}
.ucount{color:#AEB9CF;font-size:12px;display:block;margin-top:6px}
/* nodos y pistas */
.path{padding-top:10px}
.node-row{height:152px;padding-top:20px}
.trace{position:absolute;left:50%;top:0;width:300px;height:210px;transform:translate(-50%,-94px);overflow:visible;pointer-events:none;z-index:0}
.trace path{fill:none;stroke:var(--trace);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.trace path.on{stroke:var(--copper)}
.trace .via{fill:var(--bg);stroke:var(--trace);stroke-width:3}
.trace .via.on{stroke:var(--copper)}
.node{z-index:2}
.node .nicon{color:var(--ink)}
.node.done{box-shadow:0 0 0 5px var(--uc) inset,0 5px 0 color-mix(in srgb,var(--uc) 70%,#000)}
.node.done .nicon{color:var(--uc)}
.node.current{box-shadow:0 0 0 5px var(--ink) inset,0 5px 0 var(--muted),0 0 0 8px color-mix(in srgb,var(--uc) 35%,transparent)}
.node.k-project .nicon,.node.k-project .start-tag{transform:rotate(-45deg)}
.node.k-project .node-label{transform:translateX(-50%) rotate(-45deg);top:92px;left:8%}
/* tarjetas */
.hello .row{align-items:center}
.revcta{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--err);background:var(--err-soft);font-size:16px}
.revcta small{color:var(--muted)}
.revn{min-width:44px;height:44px;border-radius:12px;background:var(--err);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;display:grid;place-items:center}
.center-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.sub{font-size:17px;margin:20px 0 8px}
.revrow{display:flex;gap:12px;align-items:center;padding:14px}
.revrow small{color:var(--muted)}
.clist2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;display:flex;flex-direction:column}
.cbtn small{color:var(--muted);font-weight:400}
/* hoja de nodo */
.nsheet{border-top:6px solid var(--uc)}
.nsh{display:flex;justify-content:space-between;align-items:center}
.nkind{font-size:13px;font-weight:700;color:var(--muted)}
.nsheet h2{margin:4px 0 6px}
/* lección */
.lesson{background-image:radial-gradient(circle,var(--perf,rgba(20,33,61,.06)) 1.3px,transparent 1.6px);background-size:18px 18px}
.lesson .prog i{background:var(--uc,var(--led))}
.kind.altk{color:var(--gem)}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shead .chispa{flex:none}
.remnote{font-weight:700}
.hintbar{display:flex;gap:10px;align-items:center}
.hintbar .chispa{flex:none}
.streakpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-size:16px}
.streakpill b{font-family:var(--display);font-size:22px}
.info h2{margin-bottom:10px}
.seg4{grid-template-columns:repeat(4,1fr)}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ice);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.mprog i{background:var(--uc)!important}
.chispa{display:inline-block}

.bkta{width:100%;min-height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;word-break:break-all;margin-bottom:6px}
</style>

    function setMode(m) {
      mode = m; wireStart = null; meas = null; if (m !== 'select') sel = null;

    }
    root.querySelector('.simbar').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.m) setMode(b.dataset.m);
      const a = b.dataset.act;
      if (a === 'parts') showTray();
      if (a === 'zin') { zoom = Math.min(2, zoom * 1.25); draw(); }
      if (a === 'zout') { zoom = Math.max(0.35, zoom / 1.25); draw(); }
      if (a === '3d') toggle3D(b);
    });
    tray.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.p) { placing = b.dataset.p; tray.hidden = true; mode = 'place'; root.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', 'false')); draw(); }
      if (b.dataset.sk) { loadSketch(b.dataset.sk); tray.hidden = true; }
      if (b.dataset.act === 'closetray') tray.hidden = true;
    });
    insp.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'cancel') setMode('select');
      if (a === 'del') {
        if (sel.kind === 'comp') model.comps = model.comps.filter(c => c.id !== sel.id); else model.wires.splice(sel.i, 1);
        sel = null; changed();
      }
      if (a === 'wcolor') { const w = model.wires[sel.i]; w.color = WIRECOL[(WIRECOL.indexOf(w.color) + 1) % WIRECOL.length]; changed(); }
      if (a === 'rot') {
        const c = model.comps.find(x => x.id === sel.id);
        for (let k = 1; k <= 4; k++) { const t = { ...c, dir: ((c.dir || 0) + k) % 4 }; if (!validPlacement(t, c.id)) { c.dir = t.dir; break; } if (k === 4) cb.toast && cb.toast('No hay sitio para girarla aquí.'); }

      if (a === 'fix') { const c = model.comps.find(x => x.id === sel.id); c.burnt = false; changed(); }
      if (a === 'toggle') { const c = model.comps.find(x => x.id === sel.id); c.on = !c.on; changed(); }
    });
    let pressedComp = null;
    svg.addEventListener('pointerdown', e => {
      if (mode !== 'select') return;
      const g = e.target.closest('[data-comp]'); if (!g) return;
      const c = model.comps.find(x => x.id === g.dataset.comp);
      if (c && c.type === 'push') { c.pressed = true; pressedComp = c; buildTopo(); drawComp(c); try { navigator.vibrate && navigator.vibrate(12); } catch (_) { } }

        const comp = { id: 'c' + (nextId++), type: placing, at: PARTS[placing].dip ? [c, 7] : [c, r], dir: 0, ...JSON.parse(JSON.stringify(PARTS[placing].def)) };
        let err = null, ok = false;
        for (let d = 0; d < 4; d++) { comp.dir = d; err = validPlacement(comp); if (!err) { ok = true; break; } }
        if (!ok) { cb.toast && cb.toast(err); return; }

      }

        const id = nearestPoint(p); if (!id) return;
        if (!wireStart) { wireStart = id; draw(); return; }
        if (id === wireStart) { wireStart = null; draw(); return; }
        model.wires.push({ a: wireStart, b: id, color: WIRECOL[model.wires.length % WIRECOL.length] });
        wireStart = null; changed(); return;
      }

        const g = e.target.closest('[data-comp]');
        if (g) meas = { comp: g.dataset.comp }; else { const id = nearestPoint(p); meas = id ? { pt: id } : null; }
        draw(); return;
      }
      const g = e.target.closest('[data-comp]'), w = e.target.closest('[data-wire]');
      if (g) { const c = model.comps.find(x => x.id === g.dataset.comp); if (c && c.type === 'sw' && sel && sel.id === c.id) { c.on = !c.on; changed(); return; } sel = { kind: 'comp', id: g.dataset.comp }; }

    function save() { cb.onChange && cb.onChange(JSON.parse(JSON.stringify({ comps: model.comps.map(c => { const o = { ...c }; delete o._nodes; delete o.pressed; delete o._a; delete o._q; delete o._g; delete o._vcc; return o; }), wires: model.wires, sketch }))); }

    function loadSketch(k) {
      sketch = k; unoErr = null;
      try { uno = board.mcu === 'avr' ? new Uno(SKETCHES[k].hex) : new EspModel(k); } catch (e) { unoErr = String(e); uno = null; }
      stats.t = 0; stats.comps = {};
      cb.onSketch && cb.onSketch(k);
      save();
    }

    /* ----- 3D ----- */
    let threeView = null;
    function toggle3D(btn) {
      if (threeView) { threeView.destroy(); threeView = null; btn.setAttribute('aria-pressed', 'false'); wrap.hidden = false; return; }
      btn.setAttribute('aria-pressed', 'true');
      const holder = document.createElement('div'); holder.className = 'three'; wrap.after(holder); wrap.hidden = true;
      holder.innerHTML = '<p class="small" style="padding:16px">Cargando vista 3D…</p>';
      View3D.create(holder, { model, terms, cfg, board, pinHoles, pos, hx, ROWY, BOARD, LEDC, BANDHEX, bands, PARTS }).then(v => { threeView = v; v.destroyHolder = () => holder.remove(); const d = v.destroy; v.destroy = () => { d(); holder.remove(); }; })
        .catch(() => { holder.innerHTML = '<p class="small" style="padding:16px">No se pudo cargar la vista 3D. Comprueba tu conexión.</p>'; setTimeout(() => { holder.remove(); wrap.hidden = false; btn.setAttribute('aria-pressed', 'false'); }, 2500); });
    }

    /* ----- API para retos ----- */
    const api = {
      model, live, stats, cfg,
      comps: t => model.comps.filter(c => !t || c.type === t),
      onArduinoPin(c, pinIdx, name) { return topo && topo.nodeOf('ard:' + name) === c._nodes[pinIdx]; },
      pinV(c, i) { return live._v ? live._v[c._nodes[i]] - live._v[topo.gnd] : 0; },
      nodeVoltage(id) { const n = topo.nodeOf(id); return n === undefined ? null : live._v[n] - live._v[topo.gnd]; },
      sameNode(c, pinIdx, termId) { return topo && topo.nodeOf(termId) === c._nodes[pinIdx]; },
      // Resuelve el circuito con estados forzados (pulsadores, luz…) sin tocar el estado visible
      probe(setup) {
        const saved = model.comps.map(c => ({ pressed: c.pressed, on: c.on, light: c.light, pos: c.pos }));
        const memIC = model.comps.map(c => ({ _q: c._q, _g: c._g, _vcc: c._vcc }));
        setup(model.comps);
        const memTopo = topo; topo = { ...topo, capMem: {} }; buildTopo(); topo.dt = 1e3;
        // estado estacionario: condensadores sin carga temporal
        topo.els.forEach(e => { if (e.t === 'C') e.c = 1e-12; });
        let r = Solver.solve(topo);
        for (let k = 0; k < 8 && updateICs(r.v); k++) r = Solver.solve(topo);
        const out = {};
        for (const c of model.comps) { const els = topo.map[c.id]; out[c.id] = { I: els[0].i, V: r.v[c._nodes[0]] - r.v[c._nodes[c._nodes.length - 1]], ib: els[0].ib }; }
        model.comps.forEach((c, i) => Object.assign(c, saved[i]));
        memIC.forEach((m, i) => Object.assign(model.comps[i], m));
        topo = memTopo; buildTopo();
        return out;
      },
      resetStats() { stats.t = 0; stats.comps = {}; },
      sketch: () => sketch, speed: () => simSpeed, error: () => unoErr
    };

    buildTopo(); draw();
    if (cfg.arduino) { const want = cfg.sketches && cfg.initial && cfg.initial.sketch; loadSketch(want && cfg.sketches.includes(want) ? want : (typeof cfg.arduino === 'string' ? cfg.arduino : 'blink')); }
    raf = requestAnimationFrame(frame);
    api.destroy = () => { cancelAnimationFrame(raf); window.removeEventListener('pointerup', release); window.removeEventListener('pointercancel', release); if (threeView) threeView.destroy(); };
    api.redraw = draw;
    return api;
  }

  return { open, PARTS, fmtI, fmtV, fmtR, LEDC };
})();

/* Voltio · rutado de PCB a una cara: une cada par de pads sin cruzar pistas */
const Route = (() => {
  const NETC = { VCC: '#E5484D', GND: '#3E8FCB', LED: '#F2A900', SW: '#2EA44F', OUT: '#9B59D0', CLK: '#F07D10' };
  const LEVELS = {
    r1: { n: 6, nets: { VCC: [[0, 0], [5, 2]], GND: [[0, 5], [5, 5]], LED: [[0, 2], [3, 4]] } },
    r2: { n: 6, nets: { VCC: [[0, 0], [5, 5]], GND: [[0, 5], [4, 4]], LED: [[1, 1], [4, 3]], SW: [[0, 2], [3, 4]] } },
    r3: { n: 7, nets: { VCC: [[0, 0], [6, 6]], GND: [[0, 6], [5, 5]], LED: [[1, 1], [5, 4]], SW: [[0, 1], [4, 5]], OUT: [[2, 2], [4, 3]] } }
  };
  function open(root, levelId, onDone) {
    const L = LEVELS[levelId], n = L.n, C = 50, pad = 6;
    const paths = {}; Object.keys(L.nets).forEach(k => paths[k] = []);
    const padAt = {}; for (const [k, ps] of Object.entries(L.nets)) ps.forEach(([x, y]) => padAt[x + ',' + y] = k);
    let cur = null, done = false;
    root.innerHTML = `<div class="route"><svg viewBox="0 0 ${n * C + pad * 2} ${n * C + pad * 2}" class="pcb" style="touch-action:none"></svg>
      <div class="rstat"><span id="rs"></span><button class="sbtn" id="rclear">Borrar pistas</button></div></div>`;
    const svg = root.querySelector('svg'), rs = root.querySelector('#rs');
    const owner = (x, y) => { for (const [k, p] of Object.entries(paths)) if (p.some(([a, b]) => a === x && b === y)) return k; return padAt[x + ',' + y] || null; };
    const connected = k => { const p = paths[k], [a, b] = L.nets[k]; if (p.length < 2) return false; const s = p[0], e = p[p.length - 1]; const eq = (u, v) => u[0] === v[0] && u[1] === v[1]; return (eq(s, a) && eq(e, b)) || (eq(s, b) && eq(e, a)); };
    function draw() {
      let s = `<rect x="0" y="0" width="${n * C + pad * 2}" height="${n * C + pad * 2}" rx="10" class="pcbb"/>`;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) s += `<circle cx="${pad + x * C + C / 2}" cy="${pad + y * C + C / 2}" r="2" class="pcbg"/>`;
      for (const [k, p] of Object.entries(paths)) if (p.length > 1) s += `<polyline points="${p.map(([x, y]) => `${pad + x * C + C / 2},${pad + y * C + C / 2}`).join(' ')}" stroke="${NETC[k]}" class="trk ${connected(k) ? 'ok' : ''}"/>`;
      for (const [k, ps] of Object.entries(L.nets)) ps.forEach(([x, y]) => s += `<g><circle cx="${pad + x * C + C / 2}" cy="${pad + y * C + C / 2}" r="17" fill="${NETC[k]}" class="padc"/><circle cx="${pad + x * C + C / 2}" cy="${pad + y * C + C / 2}" r="5" class="drill"/><text x="${pad + x * C + C / 2}" y="${pad + y * C + C / 2 - 21}" text-anchor="middle" class="padl">${k}</text></g>`);
      svg.innerHTML = s;
      const ok = Object.keys(L.nets).filter(connected).length, tot = Object.keys(L.nets).length;
      const len = Object.values(paths).reduce((a, p) => a + Math.max(0, p.length - 1), 0);
      rs.textContent = `${ok}/${tot} redes conectadas · ${len * 2.54} mm de pista`.replace('.', ',');
      if (ok === tot && !done) { done = true; onDone && onDone(len); }
    }
    function cell(e) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); const x = Math.floor((p.x - pad) / C), y = Math.floor((p.y - pad) / C); return x >= 0 && y >= 0 && x < n && y < n ? [x, y] : null; }
    svg.addEventListener('pointerdown', e => {
      const c = cell(e); if (!c) return; svg.setPointerCapture(e.pointerId);
      const k = padAt[c.join(',')];
      if (k) { cur = k; paths[k] = [c]; draw(); return; }
      for (const [nk, p] of Object.entries(paths)) { const last = p[p.length - 1]; if (last && last[0] === c[0] && last[1] === c[1] && !connected(nk)) { cur = nk; return; } }
    });
    svg.addEventListener('pointermove', e => {
      if (!cur) return; const c = cell(e); if (!c) return;
      const p = paths[cur], last = p[p.length - 1];
      if (last[0] === c[0] && last[1] === c[1]) return;
      if (Math.abs(last[0] - c[0]) + Math.abs(last[1] - c[1]) !== 1) return;
      if (p.length > 1 && p[p.length - 2][0] === c[0] && p[p.length - 2][1] === c[1]) { p.pop(); draw(); return; }
      if (connected(cur)) return;
      const o = owner(c[0], c[1]);
      if (o && o !== cur) return;
      if (p.some(([a, b]) => a === c[0] && b === c[1])) return;
      if (padAt[c.join(',')] === cur) { p.push(c); cur = null; draw(); return; }
      p.push(c); draw();
    });
    const end = () => { cur = null; };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    root.querySelector('#rclear').onclick = () => { Object.keys(paths).forEach(k => paths[k] = []); done = false; draw(); };
    draw();
  }
  return { open, LEVELS };
})();

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      svg: (p, o) => `<svg viewBox="0 0 300 170" class="viz">${flowPath('M30 50L150 90', p.I1, 0.05)}${flowPath('M30 130L150 90', p.I2, 0.05)}${flowPath('M150 90H280', o.I3, 0.05)}

      svg: (p, o) => `<svg viewBox="0 0 300 170" class="viz">${flowLoop('M60 40H240V130H60Z', o.I, 0.03)}${batt(60, 85, p.V)}
        <g transform="translate(170 40) scale(1.6)"><rect x="-17" y="-7" width="34" height="14" rx="7" fill="${heat(o.hot)}" stroke="#7a6a50"/></g>

        <text x="150" y="160" text-anchor="middle" class="vizlab">P = ${o.P >= 1 ? num(o.P) + ' W' : num(o.P * 1000, 0) + ' mW'} · ${o.P > 0.25 ? 'supera ¼ W' : 'dentro de ¼ W'}</text>

    { title: 'Energía por carga', text: 'Un voltio significa que cada culombio que atraviesa la pila recibe un julio de energía. Una pila de 9 V da a cada carga 9 veces más energía que una de 1 V.', q: mcq('Una pila de 9 V y otra de 1,5 V. ¿Qué cambia?', ['La energía que recibe cada carga', 'El número de electrones del cable', 'La velocidad de la luz', 'El color de la corriente'], 'Tensión = energía por unidad de carga.') },
    { title: 'Masa como referencia', text: 'Igual que medimos la altura de una montaña desde el nivel del mar, en electrónica elegimos un punto de referencia llamado <b>masa</b> (GND) y le damos 0 V. Todas las demás tensiones se miden respecto a él.', q: mcq('Si un punto está a 5 V y otro a 2 V respecto a masa, ¿qué tensión hay entre ellos?', ['3 V', '7 V', '5 V', '2 V'], 'Diferencia: 5 − 2 = 3 V.') }

  resistance: { name: 'Resistencia', alts: [

    { title: 'Qué la determina', text: 'La resistencia de un hilo depende del material, de su longitud y de su grosor: <b>R = ρ · L / S</b>. El doble de largo, el doble de resistencia. El doble de sección, la mitad.', q: mcq('Un cable el doble de largo y del mismo grosor tiene…', ['El doble de resistencia', 'La mitad de resistencia', 'La misma resistencia', 'Cuatro veces menos'], 'R es proporcional a la longitud.') }

    { title: 'Proporciones', text: 'Con la resistencia fija, tensión y corriente van juntas: doble de tensión, doble de corriente. Con la tensión fija, resistencia y corriente van al revés: doble de resistencia, mitad de corriente.', tune: { viz: 'ohm', params: { V: { label: 'Pila', val: 4, min: 1, max: 12, step: 1, unit: 'V', dec: 0 }, R: { label: 'Resistencia', val: 1000, fmt: 'R', min: 100, max: 10000 } } }, q: mcq('Con 1 kΩ circulan 3 mA. ¿Cuánto circula con 2 kΩ y la misma pila?', ['1,5 mA', '6 mA', '3 mA', '0,3 mA'], 'Doble resistencia, mitad de corriente.') },
    { title: 'Paso a paso con unidades', text: 'El error más común es mezclar prefijos. Receta: 1) pasa todo a V, A y Ω; 2) aplica la fórmula; 3) vuelve al prefijo cómodo. Ejemplo: 9 V entre 4,7 kΩ → 9 / 4700 = 0,0019 A = 1,9 mA.', q: mcq('5 V entre 2,2 kΩ. ¿Corriente?', ['2,27 mA', '2,27 A', '0,44 mA', '11 mA'], '5 / 2200 = 0,00227 A = 2,27 mA.') }

    { title: 'Tres caminos', text: 'P = V × I es la base. Si te dan I y R, sustituye V = I·R → P = I²·R. Si te dan V y R, sustituye I = V/R → P = V²/R. Elige la que use los datos que tienes.', q: mcq('Conoces la corriente y la resistencia. ¿Qué fórmula usas?', ['P = I² × R', 'P = V² / R', 'P = V / I', 'P = R / I'], 'La que solo necesita I y R.') }

  kcl: { name: 'Ley de nudos', alts: [

    { title: 'Con signos', text: 'Cuenta como positivas las corrientes que entran y negativas las que salen: la suma siempre es cero. Si una incógnita sale negativa, es que va en sentido contrario al que supusiste.', q: mcq('Calculas una corriente de rama y te sale −5 mA. ¿Qué significa?', ['Que circula 5 mA en sentido contrario al supuesto', 'Que el circuito está mal', 'Que la corriente no existe', 'Que hay 5 mA de pérdidas'], 'El signo solo indica el sentido.') }
  ] },
  kvl: { name: 'Ley de mallas', alts: [
    { title: 'Subir y bajar una montaña', text: 'Si sales de casa, subes y bajas colinas y vuelves a casa, el desnivel total es cero. En una malla: la pila “sube” la tensión y cada componente la “baja”; al cerrar la vuelta, todo se compensa.', q: mcq('Pila de 5 V, una resistencia y un LED de 2 V. ¿Cuánto cae en la resistencia?', ['3 V', '5 V', '7 V', '2 V'], '5 − 2 = 3 V.') },
    { title: 'Compruébalo midiendo', text: 'Un truco práctico: mide la tensión de cada componente de la malla con el multímetro. Si las sumas no dan la pila, o hay un error de medida o un componente que no estás viendo (como un cable con mala conexión).', q: mcq('Mides 6 V + 2 V en una malla con una pila de 9 V. ¿Qué sospechas?', ['Que falta 1 V en alguna parte: una conexión con resistencia o un componente olvidado', 'Que Kirchhoff no se cumple aquí', 'Que la pila da 8 V exactos', 'Nada raro'], 'Kirchhoff siempre se cumple: busca dónde está el voltio que falta.') }
  ] },
  led: { name: 'LED y su resistencia', alts: [
    { title: 'Una presa que se desborda', text: 'Un LED es como una presa: por debajo de cierta tensión (≈2 V en rojo) no pasa nada; en cuanto la superas, el agua se desborda sin control. La resistencia en serie es la compuerta que limita el caudal.', q: mcq('¿Por qué no basta con dar al LED “exactamente” 2 V sin resistencia?', ['Porque un poco más de tensión dispara la corriente y lo quema', 'Porque necesita 9 V', 'Porque el LED no conduce sin resistencia', 'Sí basta'], 'Su curva es muy empinada: la resistencia lo estabiliza.') },
    { title: 'La receta en tres pasos', text: '1) Resta al voltaje de la fuente la tensión del LED: lo que queda cae en la resistencia. 2) Divide eso entre la corriente que quieres. 3) Elige el valor comercial superior.', q: mcq('5 V, LED verde de 2,1 V y 10 mA. ¿Qué resistencia comercial?', ['330 Ω', '220 Ω', '290 Ω', '510 kΩ'], '(5 − 2,1) / 0,01 = 290 Ω → 330 Ω.') }
  ] },
  rc: { name: 'Carga RC', alts: [
    { title: 'Llenar una piscina con una manguera', text: 'Un condensador es una piscina; la resistencia, el grosor de la manguera. Al principio entra mucha agua, pero cuanto más llena está, más presión hace en contra y entra más despacio. τ = R·C dice lo lento que es: manguera más fina o piscina más grande, más tiempo.', q: mcq('Si duplicas la capacidad con la misma resistencia, el tiempo de carga…', ['Se duplica', 'Se reduce a la mitad', 'No cambia', 'Se cuadruplica'], 'τ = R × C.') },
    { title: 'La regla de los 5τ', text: 'Tras 1τ está al 63 %, tras 3τ al 95 % y tras 5τ prácticamente lleno (99 %). Para calcular tiempos de retardo, piensa en múltiplos de τ.', q: mcq('τ = 0,2 s. ¿Cuánto tarda en cargarse casi del todo?', ['Alrededor de 1 s', '0,2 s', '0,04 s', '10 s'], '5 × 0,2 = 1 s.') }

  diode: { name: 'Diodo', alts: [
    { title: 'Una válvula antirretorno', text: 'Un diodo es como la válvula de un neumático: deja entrar aire pero no salir. La flecha del símbolo indica el sentido permitido (convencional): de ánodo a cátodo.', q: mcq('En el símbolo del diodo, la corriente puede ir…', ['En el sentido de la flecha (ánodo → cátodo)', 'Contra la flecha', 'En ambos sentidos', 'En ninguno'], 'La barra es el “tope”.') },
    { title: 'El peaje de 0,7 V', text: 'Para conducir, un diodo de silicio “cobra” unos 0,6–0,7 V. Ese peaje se resta siempre de la tensión disponible para el resto del circuito.', q: mcq('Dos diodos de silicio en serie con una pila de 5 V. ¿Qué tensión queda para el resto?', ['Unos 3,6 V', '5 V', '4,3 V', '1,4 V'], '5 − 0,7 − 0,7 ≈ 3,6 V.') }

  bjt: { name: 'Transistor', alts: [
    { title: 'Un grifo controlado', text: 'El transistor es un grifo: la corriente de base es la mano que lo abre y la de colector, el agua que pasa. Con poca mano mueves mucha agua; esa multiplicación es β.', q: mcq('β = 100. Si la base recibe 0,2 mA, ¿cuánta corriente puede pasar por el colector como mucho?', ['20 mA', '0,2 mA', '2 mA', '200 mA'], '100 × 0,2 mA.') },
    { title: 'Interruptor: cortado o saturado', text: 'Para usarlo como interruptor solo interesan dos estados: cortado (sin base, no pasa nada, Vce ≈ alimentación) y saturado (base de sobra, pasa todo lo que permite la carga, Vce ≈ 0,1–0,2 V).', q: mcq('Mides Vce = 8,9 V con una alimentación de 9 V. El transistor está…', ['Cortado', 'Saturado', 'Quemado seguro', 'En inversa'], 'Si apenas cae nada en la carga, no conduce.') }
  ] },
  binary: { name: 'Binario', alts: [
    { title: 'Como un cuentakilómetros', text: 'Un cuentakilómetros decimal pasa de 9 a 10 porque cada rueda tiene 10 cifras. En binario cada rueda solo tiene 0 y 1, así que pasa de 1 a 10 (que vale dos). Cada posición vale el doble que la de su derecha: 1, 2, 4, 8, 16…', q: mcq('¿Qué viene después de 0111 en binario?', ['1000', '0112', '1111', '0110'], '7 + 1 = 8 = 1000.') },
    { title: 'Pesos', text: 'Para leer un número binario, escribe debajo los pesos (… 8 4 2 1) y suma los de las posiciones con 1. 1010 = 8 + 2 = 10.', q: mcq('¿Cuánto vale 1100?', ['12', '3', '1100', '6'], '8 + 4.') }

  prefix: { name: 'Prefijos', alts: [
    { title: 'La escalera de mil', text: 'Los prefijos son peldaños de 1000 en 1000: p → n → µ → m → (unidad) → k → M. Bajar un peldaño multiplica por 1000; subirlo divide entre 1000.', q: mcq('¿Cuántos µA hay en 1 mA?', ['1000', '10', '100', '0,001'], 'Un peldaño: ×1000.') },
    { title: 'Moviendo la coma', text: 'Cambiar de prefijo es mover la coma 3 posiciones: 4,7 kΩ → 4700 Ω (coma 3 a la derecha); 0,02 A → 20 mA (coma 3 a la derecha).', q: mcq('0,0047 A en mA es…', ['4,7 mA', '47 mA', '0,47 mA', '4700 mA'], 'Coma 3 posiciones a la derecha.') }
  ] },
  pow10: { name: 'Potencias de 10', alts: [
    { title: 'Contar ceros', text: '10³ = 1000 (tres ceros). 10⁻³ = 0,001 (la coma se mueve tres a la izquierda). Multiplicar potencias suma exponentes: 10³ × 10⁻⁶ = 10⁻³.', q: mcq('10⁶ × 10⁻³ = ?', ['10³', '10⁻¹⁸', '10⁹', '10⁻³'], '6 + (−3) = 3.') }

  algebra: { name: 'Despejar', alts: [
    { title: 'La balanza', text: 'Una ecuación es una balanza equilibrada: lo que hagas a un lado, házselo al otro. Si V = I·R y quieres R, divide los dos lados entre I: V/I = R.', q: mcq('De P = V × I, despeja V', ['V = P / I', 'V = P × I', 'V = I / P', 'V = P − I'], 'Divide los dos lados entre I.') }
  ] },
  color: { name: 'Código de colores', alts: [
    { title: 'Una frase para recordarlo', text: 'Negro 0, marrón 1, rojo 2, naranja 3, amarillo 4, verde 5, azul 6, violeta 7, gris 8, blanco 9. Del oscuro al claro pasando por el arcoíris. La tercera banda dice cuántos ceros añadir.', q: mcq('Rojo, violeta, naranja', ['27 kΩ', '273 Ω', '2,7 kΩ', '270 kΩ'], '2, 7 y tres ceros: 27 000 Ω.') }
  ] },
  ac: { name: 'Corriente alterna', alts: [
    { title: 'Un columpio', text: 'La alterna es como un columpio: va y viene. La frecuencia es cuántas idas y vueltas completas hace por segundo (50 Hz en Europa). El valor eficaz (rms) es el de una continua que calentaría lo mismo: Vp/√2.', q: mcq('La red europea tiene 230 V eficaces. ¿Cuál es el pico aproximado?', ['325 V', '230 V', '163 V', '460 V'], '230 × √2 ≈ 325 V.') }
  ] },
  filter: { name: 'Filtro RC', alts: [
    { title: 'Un condensador elige frecuencias', text: 'El condensador deja pasar fácilmente las señales rápidas y bloquea las lentas. En un paso bajo RC, el condensador va a masa: “se come” lo rápido y deja pasar lo lento. La frontera es fc = 1/(2πRC).', q: mcq('En un paso bajo RC, si subes la frecuencia muy por encima de fc, la salida…', ['Baja mucho', 'Sube', 'No cambia', 'Se invierte'], 'Lo rápido se va a masa por el condensador.') }
  ] },
  log: { name: 'Logaritmos y dB', alts: [
    { title: 'Contar ceros otra vez', text: 'El logaritmo en base 10 responde a: ¿10 elevado a cuánto da este número? log(100) = 2. Los decibelios usan logaritmos porque el oído y muchos circuitos trabajan en proporciones: 20·log(×10) = 20 dB.', q: mcq('Una ganancia de ×100 en tensión son…', ['40 dB', '20 dB', '100 dB', '2 dB'], '20 · log(100) = 20 · 2.') }
  ] },
  opamp: { name: 'Amplificador operacional', alts: [
    { title: 'Las dos reglas de oro', text: 'Con realimentación negativa: 1) las entradas no consumen corriente; 2) la salida hace lo necesario para que las dos entradas tengan la misma tensión. Con eso se deducen todas las fórmulas.', q: mcq('En un seguidor de tensión (salida unida a la entrada −), si IN+ = 2 V, la salida es…', ['2 V', '0 V', 'La alimentación', '4 V'], 'La salida iguala las entradas.') }
  ] },
  ic555: { name: 'Temporizador 555', alts: [
    { title: 'Un condensador que sube y baja', text: 'Dentro del 555 hay dos comparadores que vigilan el condensador: cuando llega a 2/3 de la alimentación, lo descarga; cuando baja a 1/3, lo vuelve a cargar. La salida cambia en cada vuelta: eso es el parpadeo.', q: mcq('Si usas un condensador más grande en un 555 astable, el LED parpadea…', ['Más despacio', 'Más rápido', 'Igual', 'Deja de parpadear'], 'Más capacidad, más tiempo en cargar y descargar.') }
  ] },
  pullup: { name: 'Pull-up', alts: [
    { title: 'Un muelle', text: 'Una resistencia de pull-up es un muelle que mantiene la entrada arriba (HIGH) cuando nadie la toca. El pulsador, al cerrarse, la lleva a masa con más fuerza que el muelle: LOW.', q: mcq('Sin pull-up ni pull-down, una entrada sin conectar…', ['Lee valores al azar (flota)', 'Lee siempre LOW', 'Lee siempre HIGH', 'Se quema'], 'Por eso siempre hay que fijarla.') }

  meter_v: { name: 'Medir tensión', alts: [
    { title: 'Mirar desde fuera', text: 'Para medir tensión no hay que tocar el circuito: el multímetro se apoya por fuera, una punta a cada lado del componente, como quien compara la altura de dos escalones. Por dentro tiene muchísima resistencia y apenas roba corriente.', q: mcq('¿Hay que abrir el circuito para medir tensión?', ['No: se mide en paralelo', 'Sí: se mide en serie', 'Solo con multímetro manual', 'Solo si es alterna'], 'Paralelo, sin desmontar nada.') }
  ] },
  meter_a: { name: 'Medir corriente', alts: [
    { title: 'Un contador en la tubería', text: 'Para contar el agua que pasa hay que cortar la tubería y meter el contador en medio: toda el agua lo atraviesa. Con la corriente igual: se abre el circuito y el multímetro va en serie, con la punta roja en mA.', q: mcq('¿Por qué es peligroso poner el multímetro en modo corriente en paralelo con una pila?', ['Porque por dentro es casi un cable y provoca un cortocircuito', 'Porque mide alterna', 'Porque marca negativo', 'No es peligroso'], 'El fusible está ahí por eso.') }
  ] },
  breadboard: { name: 'Protoboard', alts: [
    { title: 'Tiras ocultas', text: 'Debajo de cada columna de 5 agujeros hay una pinza metálica: todo lo que pinches en la misma columna (a–e) queda unido. La ranura central separa la mitad de arriba de la de abajo. Las filas largas de los bordes son la alimentación.', q: mcq('Pinchas un cable en b7 y otro en e7. ¿Están conectados?', ['Sí, misma columna y mismo lado', 'No, filas distintas', 'Solo si hay un puente', 'Depende del cable'], 'a–e de la misma columna = un solo nudo.') }
  ] },
  schematic: { name: 'Esquemas', alts: [
    { title: 'Un mapa de metro', text: 'Un esquema es como un mapa de metro: no respeta las distancias reales, solo qué está unido con qué. Dos dibujos muy distintos pueden ser el mismo circuito.', q: mcq('Dos esquemas tienen formas distintas pero las mismas conexiones. ¿Son el mismo circuito?', ['Sí', 'No', 'Solo si tienen el mismo tamaño', 'Solo si los colores coinciden'], 'Lo que importa son las conexiones.') }
  ] },
  cap: { name: 'Condensador', alts: [
    { title: 'Un depósito pequeño', text: 'Un condensador guarda carga entre dos placas. Se llena y se vacía muy rápido, y en continua, una vez lleno, no deja pasar corriente. Su capacidad (µF) es el tamaño del depósito.', q: mcq('En continua y ya cargado, un condensador se comporta como…', ['Un circuito abierto', 'Un cable', 'Una pila infinita', 'Una resistencia de 0 Ω'], 'Bloquea la continua.') }
  ] },
  logic: { name: 'Puertas lógicas', alts: [
    { title: 'Interruptores', text: 'AND son interruptores en serie (todos cerrados para que pase). OR son interruptores en paralelo (basta uno). NOT invierte. Todas las demás se construyen combinándolas.', q: mcq('Una alarma suena si la puerta está abierta O la ventana está abierta. ¿Qué puerta?', ['OR', 'AND', 'NOT', 'NAND'], 'Basta una condición.') }
  ] },
  pwm: { name: 'PWM', alts: [
    { title: 'Parpadeo muy rápido', text: 'Si enciendes y apagas una luz muy rápido, el ojo ve la media. PWM hace eso cientos de veces por segundo: con el 25 % del tiempo encendido, ves un 25 % de brillo.', q: mcq('analogWrite(pin, 255) equivale a…', ['Siempre encendido', 'Apagado', 'La mitad', '255 V'], '255 es el máximo: 100 %.') }
  ] },
  adc: { name: 'Conversión analógica', alts: [
    { title: 'Una regla con marcas', text: 'El ADC mide una tensión con una regla de marcas: la Uno tiene 1024 marcas entre 0 y 5 V (unos 4,9 mV cada una). El número que devuelve es la marca más cercana.', q: mcq('analogRead devuelve 512 en una Uno. ¿Tensión aproximada?', ['2,5 V', '5 V', '512 V', '1 V'], '512/1023 × 5 ≈ 2,5 V.') }
  ] }
};

/* Voltio · generadores de ejercicios. Cada uno devuelve un ejercicio nuevo
   (mc o num) con valores distintos y distractores sacados de errores típicos. */
const Gen = (() => {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const fmt = (x, d = 3) => { const r = Math.round(x * 10 ** d) / 10 ** d; return String(r).replace('.', ','); };
  const fR = r => r >= 1e6 ? fmt(r / 1e6) + ' MΩ' : r >= 1000 ? fmt(r / 1000) + ' kΩ' : fmt(r) + ' Ω';
  const fA = i => Math.abs(i) >= 1 ? fmt(i) + ' A' : fmt(i * 1000, 2) + ' mA';
  const fV = v => fmt(v, 2) + ' V';
  const sup = n => String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)] || (c === '-' ? '⁻' : c)).join('');
  const uniq = (right, wrong) => { const s = new Set([right]); const o = [right]; for (const w of wrong) if (!s.has(w) && o.length < 4) { s.add(w); o.push(w); } return o; };
  const MC = (q, right, wrong, e, extra = {}) => ({ t: 'mc', q, o: uniq(right, wrong), a: 0, e, ...extra });
  const N = (q, a, u, e, tol) => ({ t: 'num', q, a, u, e, tol });
  const E = [10, 22, 33, 47, 68, 100, 150, 220, 330, 470, 680, 1000, 1500, 2200, 3300, 4700, 6800, 10000, 22000, 47000, 100000];
  const PREF = [['p', -12], ['n', -9], ['µ', -6], ['m', -3], ['', 0], ['k', 3], ['M', 6]];

  const G = {
    pow10: () => { const a = ri(-6, 6), b = ri(-6, 6); return MC(`¿Cuánto es 10${sup(a)} × 10${sup(b)}?`, '10' + sup(a + b), ['10' + sup(a * b), '10' + sup(a - b), '10' + sup(a + b + 1), '10' + sup(a + b - 1), '10' + sup(-(a + b) + 2)], 'Al multiplicar potencias de la misma base, los exponentes se suman.'); },
    pow10div: () => { const a = ri(-3, 6), b = ri(-6, 3); return MC(`¿Cuánto es 10${sup(a)} ÷ 10${sup(b)}?`, '10' + sup(a - b), ['10' + sup(a + b), '10' + sup(b - a), '10' + sup(a * b), '10' + sup(a - b + 1), '10' + sup(a - b - 1)], 'Al dividir, se resta el exponente de abajo al de arriba.'); },
    sci: () => { const m = pick([4.7, 2.2, 3.3, 1.5, 6.8]), e = pick([-6, -5, -4, -3, 3, 4, 5]); const val = m * 10 ** e; const s = val < 1 ? fmt(val, 8) : String(Math.round(val)); return MC(`¿Cómo se escribe ${s} en notación científica?`, `${fmt(m)} × 10${sup(e)}`, [`${fmt(m)} × 10${sup(-e)}`, `${fmt(m)} × 10${sup(e + 1)}`, `${fmt(m * 10)} × 10${sup(e + 1)}`], 'Mueve la coma hasta dejar una sola cifra delante; cada salto es una potencia de 10.'); },
    prefixName: () => { const [p, e] = pick(PREF.filter(x => x[0])); return MC(`¿Cuánto vale el prefijo “${p}”?`, '10' + sup(e), PREF.filter(x => x[0] && x[0] !== p).map(x => '10' + sup(x[1])).sort(() => Math.random() - .5), `${p} = 10${sup(e)}. Memoriza la escalera: p, n, µ, m, (unidad), k, M; cada peldaño son 1000.`); },
    prefixConv: () => {
      const cases = [
        () => { const v = pick([1.5, 2.2, 4.7, 10, 22, 0.33]); return N(`${fmt(v)} kΩ son… ¿cuántos ohmios?`, v * 1000, 'Ω', `k = ×1000 → ${fmt(v * 1000)} Ω.`); },
        () => { const v = pick([0.02, 0.015, 0.25, 0.005, 0.12]); return N(`${fmt(v, 4)} A son… ¿cuántos miliamperios?`, v * 1000, 'mA', `×1000 → ${fmt(v * 1000)} mA.`); },
        () => { const v = pick([20, 350, 4.5, 1200]); return N(`${fmt(v)} mA son… ¿cuántos amperios?`, v / 1000, 'A', `÷1000 → ${fmt(v / 1000, 4)} A.`); },
        () => { const v = pick([100, 470, 2200, 47]); return N(`${v} nF son… ¿cuántos microfaradios?`, v / 1000, 'µF', `De n a µ hay un salto de 1000: ÷1000 → ${fmt(v / 1000, 3)} µF.`); },
        () => { const v = pick([3300, 47000, 680, 220000]); return N(`${v} Ω son… ¿cuántos kiloohmios?`, v / 1000, 'kΩ', `÷1000 → ${fmt(v / 1000)} kΩ.`); },
        () => { const v = pick([0.1, 0.47, 2.2, 10]); return N(`${fmt(v)} µF son… ¿cuántos nanofaradios?`, v * 1000, 'nF', `×1000 → ${fmt(v * 1000)} nF.`); }
      ];
      return pick(cases)();
    },
    rearrange: () => { const c = pick([['V = I × R', 'R', 'R = V / I', ['R = I / V', 'R = V × I', 'R = I − V']], ['V = I × R', 'I', 'I = V / R', ['I = R / V', 'I = V × R', 'I = V − R']], ['P = V × I', 'I', 'I = P / V', ['I = V / P', 'I = P × V', 'I = P − V']], ['P = I² × R', 'R', 'R = P / I²', ['R = P × I²', 'R = I² / P', 'R = √P / I']], ['P = V² / R', 'R', 'R = V² / P', ['R = P / V²', 'R = V² × P', 'R = V / P']], ['τ = R × C', 'C', 'C = τ / R', ['C = R / τ', 'C = τ × R', 'C = τ − R']], ['f = 1 / T', 'T', 'T = 1 / f', ['T = f', 'T = f / 1', 'T = 1 × f']]]); return MC(`Despeja ${c[1]} de ${c[0]}`, c[2], c[3], 'Para despejar, haz la misma operación a los dos lados hasta dejar la incógnita sola.'); },
    proportion: () => { const a = pick([2, 3, 4, 5]), b = pick([10, 20, 30, 50]), k = pick([2, 3, 4, 6]); return N(`Si ${a} pilas iguales dan ${a * 1.5} V en serie, ¿cuántos voltios dan ${a * k}?`, a * k * 1.5, 'V', 'Es proporcional: el doble de pilas, el doble de tensión.'); },
    percent: () => { const v = pick([9, 5, 12, 3.3]), p = pick([10, 20, 25, 50]); return N(`¿Cuánto es el ${p} % de ${fmt(v)} V?`, v * p / 100, 'V', `${fmt(v)} × ${p} / 100 = ${fmt(v * p / 100)} V.`); },
    tolerance: () => { const r = pick([1000, 4700, 220, 10000, 330]), t = pick([5, 10, 1]); const lo = r * (1 - t / 100), hi = r * (1 + t / 100); return MC(`Una resistencia de ${fR(r)} con tolerancia ±${t} %. ¿Entre qué valores puede estar?`, `${fR(lo)} y ${fR(hi)}`, [`${fR(r - t)} y ${fR(r + t)}`, `${fR(r * (1 - t / 10))} y ${fR(r * (1 + t / 10))}`, `${fR(r)} y ${fR(hi)}`], `${t} % de ${fR(r)} es ${fR(r * t / 100)}: se resta y se suma.`); },
    estimate: () => { const V = pick([5, 9, 12]), R = pick([470, 1000, 2200, 10000, 100]); const I = V / R; return MC(`Sin calculadora: ${V} V entre ${fR(R)}, ¿qué orden de magnitud tiene la corriente?`, I >= 0.01 ? 'Decenas de mA' : I >= 0.001 ? 'Unos pocos mA' : 'Cientos de µA o menos', ['Decenas de mA', 'Unos pocos mA', 'Cientos de µA o menos', 'Amperios'], `${V} / ${R} ≈ ${fA(I)}. Estimar el orden de magnitud te salva de errores de prefijos.`); },

    ohmI: () => { const V = pick([3, 5, 9, 12]), R = pick([100, 220, 470, 1000, 2200]); return N(`${V} V aplicados a ${fR(R)}. ¿Qué corriente circula en mA?`, V / R * 1000, 'mA', `I = V / R = ${V} / ${R} = ${fmt(V / R, 5)} A = ${fmt(V / R * 1000)} mA.`, Math.max(0.05, V / R * 10)); },

    ohmMC: () => { const V = pick([5, 9, 12]), R = pick([100, 470, 1000]); const I = V / R; return MC(`${V} V sobre ${fR(R)}. ¿Corriente?`, fA(I), [fA(R / V / 1000), fA(V * R / 1e6), fA(I * 10)], `I = V / R. Los otros resultados vienen de invertir la fórmula o equivocarse de prefijo.`); },

    ledR: () => { const Vs = pick([5, 9, 12, 3.3]), [col, Vf] = pick([['rojo', 1.8], ['verde', 2.1], ['azul', 3.0], ['amarillo', 2.0]]), I = pick([0.01, 0.015, 0.02]); if (Vs <= Vf) return G.ledR(); return N(`Fuente de ${fmt(Vs)} V, LED ${col} (${fmt(Vf)} V) y ${fA(I)}. ¿Resistencia en Ω?`, (Vs - Vf) / I, 'Ω', `R = (${fmt(Vs)} − ${fmt(Vf)}) / ${fmt(I, 3)} = ${fmt((Vs - Vf) / I)} Ω. Luego eliges el valor comercial siguiente.`, 2); },

 L('a3', 'Despejar fórmulas', 'ohm', ['algebra'], [

 ]),
 L('a4', 'Proporciones y porcentajes', 'div', ['algebra'], [

 ]),
 L('a5', 'Inversos y la fórmula del paralelo', 'series', ['parallel'], [

  Q('Inverso de 0,5', ['2', '0,5', '−0,5', '0,25'], '1 / 0,5 = 2.'),

 ]),
 L('a6', 'Estimar y redondear', 'bin', ['prefix'], [

 ])
] },

{ id: 'm1', title: 'Qué es la electricidad', desc: 'Carga, corriente, tensión y resistencia desde cero.', nodes: [
 L('b1', 'Átomos y carga eléctrica', 'bolt', ['charge'], [
  I('Toda la materia está hecha de átomos. Cada átomo tiene un núcleo con <b>protones</b> (carga positiva) y alrededor <b>electrones</b> (carga negativa). Normalmente hay los mismos de cada tipo y el átomo es neutro.\nCargas iguales se repelen; opuestas se atraen.'),
  Q('¿Qué carga tiene un electrón?', ['Negativa', 'Positiva', 'Ninguna', 'Depende del material'], 'Electrones −, protones +.'),
  Q('Dos objetos con carga negativa se acercan. ¿Qué pasa?', ['Se repelen', 'Se atraen', 'Nada', 'Se neutralizan'], 'Iguales se repelen.'),
  I('En los metales, algunos electrones están sueltos y saltan de átomo en átomo: son los <b>electrones libres</b>, y forman la corriente.\nLa carga se mide en culombios (C): un culombio son unos 6,24 × 10¹⁸ electrones.'),
  Q('¿Qué permite que el cobre conduzca?', ['Tiene electrones libres', 'Está hueco', 'Tiene protones sueltos', 'Viene cargado de fábrica'], 'Electrones poco ligados.'),
  Q('Al frotar un globo en el pelo queda cargado negativamente. ¿Qué ha ganado?', ['Electrones', 'Protones', 'Átomos', 'Neutrones'], 'Los electrones son los que se mueven.')
 ]),
 L('b2', 'Conductores, aislantes y semiconductores', 'bolt', ['resistance'], [
  I('<b>Conductores</b> (cobre, plata, aluminio, oro): muchos electrones libres.\n<b>Aislantes</b> (plástico, vidrio, goma, aire seco): casi ninguno.\n<b>Semiconductores</b> (silicio, germanio): en medio y controlables. De ellos se hacen diodos, transistores y chips.'),
  { t: 'match', q: 'Clasifica cada material.', pairs: [['Cobre', 'Conductor'], ['Goma', 'Aislante'], ['Silicio', 'Semiconductor'], ['Aluminio', 'Conductor ']] },
  Q('¿Por qué los cables llevan cobre dentro y plástico fuera?', ['El cobre conduce y el plástico protege', 'El plástico conduce mejor', 'Para que pesen menos', 'Por estética'], 'Conductor para llevar, aislante para proteger.'),
  Q('El agua del grifo…', ['Conduce por las sales disueltas: nunca juegues con electricidad cerca del agua', 'Es un aislante perfecto', 'Es un semiconductor', 'Solo conduce caliente'], 'Las sales la hacen conductora.'),
  Q('¿Qué material es la base de casi todos los chips?', ['Silicio', 'Cobre', 'Plástico', 'Oro'], 'De ahí Silicon Valley.')
 ]),
 L('b3', 'La corriente: carga en movimiento', 'bolt', ['current'], [
  I('La <b>corriente</b> es la carga que pasa por un punto cada segundo. Se mide en <b>amperios</b>: 1 A = 1 culombio por segundo.\n<b>I = Q / t</b>', { tune: { viz: 'ohm', params: { V: pV(6), R: pR('Resistencia', 470, 100, 4700) } } }),
  Q('Pasan 10 culombios en 5 segundos. ¿Corriente?', ['2 A', '50 A', '0,5 A', '10 A'], 'I = 10 / 5.', { c: 'charge' }),
  I('Los electrones avanzan despacísimo (milímetros por segundo). Pero el cable ya está lleno de ellos: cuando la pila empuja, se mueven todos a la vez y la luz se enciende al instante.'),
  Q('La luz se enciende al momento porque…', ['Todos los electrones del cable empiezan a moverse a la vez', 'Viajan a la velocidad de la luz', 'La bombilla guarda energía', 'El interruptor fabrica electrones'], 'Como una fila de canicas.', { c: 'charge' }),
  I('Por convenio, la <b>corriente convencional</b> va del + al − por fuera de la pila. Los electrones van al revés, pero todos los esquemas y fórmulas usan el sentido convencional.'),
  Q('En un esquema, la corriente sale de la pila por…', ['El polo +', 'El polo −', 'Los dos', 'Ninguno'], 'Sentido convencional.'),
  Q('¿La corriente que vuelve a la pila es menor que la que sale?', ['No, es la misma', 'Sí, la bombilla la consume', 'Sí, la mitad', 'Depende'], 'Se consume energía, no carga.'),
  G('prefixConv')
 ]),
 L('b4', 'La tensión: el empuje', 'bat', ['voltage'], [
  I('La <b>tensión</b> (diferencia de potencial, voltaje) es el empuje que mueve las cargas. Se mide en <b>voltios</b>.\nLo más importante: la tensión siempre es <b>entre dos puntos</b>.'),
  Q('¿Por qué el multímetro usa dos puntas para medir tensión?', ['Porque la tensión es una diferencia entre dos puntos', 'Por si una se rompe', 'Ida y vuelta', 'Para ir más rápido'], 'Siempre se compara un punto con otro.'),
  I('Elegimos un punto de referencia llamado <b>masa</b> o <b>GND</b> (normalmente el − de la pila) y le damos 0 V. “Este punto está a 5 V” significa “a 5 V respecto a masa”.', { symk: 'gnd' }),
  Q('A está a 9 V y B a 4 V respecto a masa. ¿Tensión entre A y B?', ['5 V', '13 V', '9 V', '4 V'], 'Diferencia: 9 − 4.'),
  I('Físicamente, la tensión es <b>energía por unidad de carga</b>: 1 V = 1 julio por culombio.'),
  Q('Dos pilas de 1,5 V en serie (+ con −) dan…', ['3 V', '1,5 V', '0 V', '2,25 V'], 'En serie se suman.'),
  Q('¿Y si pones una del revés (+ con +)?', ['Se restan: 0 V', 'Se suman: 3 V', 'Explotan', '1,5 V'], 'Una empuja contra la otra.'),
  G('kvl')
 ]),
 L('b5', 'La resistencia: el freno', 'res', ['resistance'], [
  I('La <b>resistencia</b> es la oposición al paso de la corriente. Se mide en <b>ohmios</b> (Ω). Al vencerla, la energía se convierte en calor: así funcionan estufas y tostadoras.', { symk: 'res' }),
  I('La resistencia de un hilo depende de:\n· El <b>material</b> (resistividad ρ).\n· La <b>longitud</b>: más largo, más resistencia.\n· La <b>sección</b>: más grueso, menos.\n<b>R = ρ · L / S</b>'),
  Q('2 m de cable tienen 0,1 Ω. ¿Y 6 m del mismo cable?', ['0,3 Ω', '0,03 Ω', '0,1 Ω', '0,6 Ω'], 'Proporcional a la longitud.'),
  Q('El doble de sección, mismo material y longitud…', ['La mitad de resistencia', 'El doble', 'La misma', 'Cuatro veces más'], 'Inversamente proporcional a la sección.'),
  Q('¿Por qué los cables de un horno son más gruesos que los de un cargador?', ['Llevan más corriente y deben tener poca resistencia', 'Para que no se rompan', 'Por el color', 'Por la tensión'], 'Más corriente, más sección.'),
  I('Las <b>resistencias</b> (componentes) ponen exactamente la oposición que queremos: limitar la corriente de un LED, fijar una tensión, ajustar un tiempo.'),
  G('colorRead')
 ]),
 L('b6', 'Abierto, cerrado y cortocircuito', 'bolt', ['circuit'], [

  Q('Si el LED se desconecta de un lado, ¿qué pasa?', ['Se apaga todo: circuito abierto', 'Sigue la mitad', 'Cortocircuito', 'La resistencia se calienta'], 'Un corte abre el circuito.', { sch: 'flashlight' }),
  I('Un <b>cortocircuito</b> es un camino casi sin resistencia entre los polos. La corriente se dispara: cables calientes, pilas agotadas en minutos o baterías de litio que se incendian. Los fusibles cortan el circuito si pasa.'),
  Q('¿Qué limita la corriente en un cortocircuito de una pila?', ['Solo su resistencia interna y la de los cables', 'Nada, es infinita', 'El color del cable', 'La tensión baja a cero'], 'Por eso se calienta.'),
  Q('¿Para qué sirve un fusible?', ['Para fundirse y abrir el circuito ante corriente excesiva', 'Para aumentar la corriente', 'Para medir', 'Para guardar carga'], 'Un punto débil a propósito.'),
  { t: 'pick', q: '¿Cuál de estos circuitos tiene un problema grave?', o: ['ledNoRes', 'ledBasic', 'flashlight'], a: 0, e: 'Sin resistencia, el LED casi cortocircuita la pila.', c: 'circuit' }
 ]),
 L('b7', 'Fuentes de energía', 'bat', ['voltage'], [

  Q('Una pila de 9 V marca 9,3 V en vacío y 7,5 V con un motor. ¿Por qué?', ['La corriente provoca caída en su resistencia interna', 'El motor fabrica tensión', 'El multímetro falla', 'Está rota'], 'Más gastada, más resistencia interna.'),
  I('· Pila AA: 1,5 V. · Pila cuadrada: 9 V (seis celdas de 1,5 V).\n· Li-ion: 3,7 V nominales (4,2 V llena).\n· USB: 5 V.\n· Fuente de laboratorio: tensión ajustable y límite de corriente.'),
  { t: 'match', q: 'Une cada fuente con su tensión.', pairs: [['Pila AA', '1,5 V'], ['Li-ion', '3,7 V'], ['USB', '5 V'], ['Pila cuadrada', '9 V']] },
  Q('¿Qué ventaja tiene el límite de corriente de una fuente de laboratorio?', ['Si te equivocas, evita quemar componentes', 'Da más tensión', 'Hace el circuito más rápido', 'Ninguna'], 'La mejor protección mientras aprendes.'),
  Q('Cuatro pilas AA en serie dan…', ['6 V', '1,5 V', '4 V', '3 V'], '4 × 1,5 V.')
 ]),
 SIM('s1a', 'Reto: tu primer circuito', 'Monta pila, interruptor, resistencia y LED. El LED solo debe encenderse con el interruptor cerrado.', { battery: 9, parts: ['sw', 'res', 'led'], sch: 'flashlight', hint: 'Del + al interruptor, luego la resistencia, luego el LED (pata + hacia la resistencia) y vuelta al −. Toca el interruptor dos veces para cambiarlo.' }, 'flashlight')
] },

{ id: 'm7', title: 'Corriente alterna', desc: 'Senoides, valor eficaz, reactancia, filtros y transformadores.', nodes: [
 L('h1', 'Matemáticas: logaritmos y dB', 'bin', ['log'], [
  I('La alterna se describe con el <b>seno</b>: v(t) = Vp · sen(2π·f·t). Para comparar señales muy distintas se usan <b>logaritmos</b>: log₁₀(1000) = 3 porque 10³ = 1000.'),
  G('log10'), G('log10'),

 ]),
 L('h2', 'Qué es la alterna', 'bolt', ['ac'], [
  I('En <b>continua</b> la corriente va siempre en el mismo sentido; en <b>alterna</b> cambia muchas veces por segundo. La red es alterna porque los transformadores cambian su tensión fácilmente.'),
  Q('¿Cuántos ciclos por segundo hace la red europea?', ['50', '230', '60', '1'], '50 Hz.'),
  I('· <b>Vp</b>: el pico. · <b>Vpp</b>: pico a pico, 2·Vp.\n· <b>Periodo T</b>: un ciclo. <b>f = 1/T</b>.'),
  G('period'), G('period'),
  Q('Senoide de 10 V de pico. ¿Vpp?', ['20 V', '10 V', '7,07 V', '5 V'], '2 × Vp.')
 ]),
 L('h3', 'Valor eficaz (rms)', 'bolt', ['ac'], [
  I('El <b>valor eficaz</b> es la continua que calentaría lo mismo. En una senoide: <b>Vrms = Vp / √2</b>. Los 230 V de casa son eficaces: el pico es unos 325 V.'),
  G('vrms'), G('vrms'),
  Q('Un multímetro en V~ mide…', ['El valor eficaz', 'El pico', 'El pico a pico', 'La frecuencia'], 'Por eso marca 230 V.'),
  Q('¿Por qué la red es peligrosa?', ['Puede hacer pasar por tu cuerpo corrientes mortales: no trabajes con ella sin formación', 'No lo es', 'Porque es continua', 'Porque los enchufes tienen mucha resistencia'], 'Bastan decenas de mA por el corazón. En este curso usamos baja tensión.')
 ]),
 L('h4', 'Reactancia del condensador', 'cap', ['filter'], [
  I('En alterna, un condensador se carga y descarga continuamente y deja pasar corriente. Su oposición es la <b>reactancia</b>: <b>Xc = 1 / (2π · f · C)</b>. A más frecuencia, menos reactancia.'),
  G('xc'), G('xc'),
  Q('Frecuencia ×2: la reactancia…', ['Se reduce a la mitad', 'Se duplica', 'No cambia', 'Cero'], 'Inversa a f.'),
  Q('En continua (f = 0), la reactancia es…', ['Infinita', 'Cero', '1 Ω', 'Igual a C'], 'Bloquea la continua.', { c: 'cap' })
 ]),
 L('h5', 'Filtros RC', 'cap', ['filter'], [
  I('· <b>Paso bajo</b>: R en serie y C a masa. Deja pasar lo lento.\n· <b>Paso alto</b>: C en serie y R a masa. Deja pasar lo rápido.\nFrontera: <b>fc = 1 / (2π · R · C)</b>, donde la señal cae 3 dB.'),
  G('fc'), G('fc'),
  Q('Quitar ruido rápido de un sensor lento:', ['Paso bajo', 'Paso alto', 'Ninguno', 'Amplificador'], 'Deja pasar lo lento.'),
  Q('Condensador en serie con la entrada de un amplificador de audio:', ['Bloquea la continua y deja pasar el audio', 'Amplifica', 'Bloquea el audio', 'Nada'], 'Condensador de acoplo.'),
  Q('Por encima de fc, un paso bajo de primer orden atenúa unos…', ['20 dB por década', '3 dB en total', '100 dB', 'Nada'], 'Cada ×10 en frecuencia, ÷10 en amplitud.', { c: 'log' })
 ]),
 L('h6', 'Transformadores', 'bolt', ['ac'], [
  I('Dos bobinas sobre un núcleo. La relación de tensiones es la de vueltas: <b>Vs / Vp = Ns / Np</b>. Solo funciona con alterna.'),
  Nm('1000 vueltas en el primario, 50 en el secundario, 230 V. ¿Secundario?', 11.5, 'V', '230 × 50 / 1000.'),
  Q('¿Por qué no funciona con una pila?', ['Necesita una corriente que cambie para inducir tensión', 'La pila es pequeña', 'Sí funciona', 'Por la polaridad'], 'Inducción = cambio.'),
  Q('¿Qué ventaja de seguridad da?', ['Aislamiento galvánico entre la red y tu circuito', 'No se calienta', 'No pesa', 'Ninguna'], 'No hay conexión directa entre bobinas.')
 ])
] },

{ id: 'm9', title: 'Transistores', desc: 'BJT y MOSFET como interruptores y amplificadores.', nodes: [
